version: "3.8"

services:

  # ── Mock RTSP-сервер (имитирует IP-камеры) ────────────────────────────────
  mock-camera-1:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-camera-1
    environment:
      CAMERA_ID: "camera-1"
      LATENCY_MS: "45"
      PACKET_LOSS: "0.02"
      PORT: "8554"
    ports:
      - "8554:8554"
    networks:
      - monitoring

  mock-camera-2:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-camera-2
    environment:
      CAMERA_ID: "camera-2"
      LATENCY_MS: "120"
      PACKET_LOSS: "0.08"
      PORT: "8554"
    ports:
      - "8555:8554"
    networks:
      - monitoring

  mock-camera-3:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-camera-3
    environment:
      CAMERA_ID: "camera-3"
      LATENCY_MS: "20"
      PACKET_LOSS: "0.00"
      PORT: "8554"
    ports:
      - "8556:8554"
    networks:
      - monitoring

  # ── Кастомный RTSP-экспортёр ──────────────────────────────────────────────
  rtsp-exporter:
    build:
      context: .
      dockerfile: Dockerfile.exporter
    container_name: rtsp-exporter
    ports:
      - "9115:9115"
    volumes:
      - ./exporter_config.yml:/app/exporter_config.yml
    networks:
      - monitoring
    depends_on:
      - mock-camera-1
      - mock-camera-2
      - mock-camera-3

  # ── Config API (FastAPI) ──────────────────────────────────────────────────
  config-api:
    build:
      context: ./config_api
      dockerfile: Dockerfile
    container_name: config-api
    ports:
      - "8000:8000"
    environment:
      CONFIG_PATH: "/config/exporter_config.yml"
    volumes:
      - ./exporter_config.yml:/config/exporter_config.yml
    networks:
      - monitoring

  # ── Config UI (React + Nginx) ─────────────────────────────────────────────
  config-ui:
    build:
      context: ./config_ui
      dockerfile: Dockerfile
    container_name: config-ui
    ports:
      - "8080:80"
    networks:
      - monitoring
    depends_on:
      - config-api

  # ── Blackbox exporter (ICMP / HTTP-проверки) ──────────────────────────────
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox
    ports:
      - "9116:9115"
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring

  # ── VictoriaMetrics ───────────────────────────────────────────────────────
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    container_name: victoriametrics
    ports:
      - "9090:8428"
    volumes:
      - ./prometheus.yml:/etc/victoriametrics/prometheus.yml:ro
      - victoriametrics_data:/victoria-metrics-data
    command:
      - "--promscrape.config=/etc/victoriametrics/prometheus.yml"
      - "--retentionPeriod=7d"
    networks:
      - monitoring
    depends_on:
      - blackbox
      - rtsp-exporter

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LIVE_ALLOWED_ORIGINS: "*"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - victoriametrics

networks:
  monitoring:
    driver: bridge

volumes:
  victoriametrics_data:
  grafana_data: