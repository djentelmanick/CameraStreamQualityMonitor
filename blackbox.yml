modules:
  # ── ICMP ping (проверка доступности на уровне сети) ──────────────────────
  icmp_check:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

  # ── HTTP-проверка (веб-интерфейс камеры / NVR) ────────────────────────────
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 401]   # 401 — нормально для закрытых камер
      method: GET
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
      tls_config:
        insecure_skip_verify: true    # камеры часто используют self-signed сертификаты

  # ── TCP-проверка RTSP-порта (554) ─────────────────────────────────────────
  tcp_rtsp:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

  # ── TCP-проверка ONVIF (порт 80/8080) ────────────────────────────────────
  tcp_onvif:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
